global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway-1:8000", "gateway-2:8000", "gateway-3:8000"]

  - job_name: loadbalancer
    metrics_path: /lb/metrics
    static_configs:
      - targets: ["loadbalancer:8080"]
