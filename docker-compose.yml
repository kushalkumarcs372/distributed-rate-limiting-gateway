services:
  redis-shard-1:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  redis-shard-2:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  redis-shard-3:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway"]
      interval: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  gateway-1:
    build: .
    ports:
      - "8001:8000"  # diagnostic: hit gateway-1 directly, bypassing the LB
    environment:
      NODE_ID: gateway-1
      REDIS_SHARDS: "redis-shard-1,redis-shard-2,redis-shard-3"
      POSTGRES_DSN: postgresql://gateway:gateway@postgres:5432/gateway
      RATE_LIMIT: "10"
      RATE_LIMIT_WINDOW_SECONDS: "60"
    depends_on:
      redis-shard-1: { condition: service_healthy }
      redis-shard-2: { condition: service_healthy }
      redis-shard-3: { condition: service_healthy }
      postgres: { condition: service_healthy }
    command: uvicorn gateway.app:app --host 0.0.0.0 --port 8000

  gateway-2:
    build: .
    environment:
      NODE_ID: gateway-2
      REDIS_SHARDS: "redis-shard-1,redis-shard-2,redis-shard-3"
      POSTGRES_DSN: postgresql://gateway:gateway@postgres:5432/gateway
      RATE_LIMIT: "10"
      RATE_LIMIT_WINDOW_SECONDS: "60"
    depends_on:
      redis-shard-1: { condition: service_healthy }
      redis-shard-2: { condition: service_healthy }
      redis-shard-3: { condition: service_healthy }
      postgres: { condition: service_healthy }
    command: uvicorn gateway.app:app --host 0.0.0.0 --port 8000

  gateway-3:
    build: .
    environment:
      NODE_ID: gateway-3
      REDIS_SHARDS: "redis-shard-1,redis-shard-2,redis-shard-3"
      POSTGRES_DSN: postgresql://gateway:gateway@postgres:5432/gateway
      RATE_LIMIT: "10"
      RATE_LIMIT_WINDOW_SECONDS: "60"
    depends_on:
      redis-shard-1: { condition: service_healthy }
      redis-shard-2: { condition: service_healthy }
      redis-shard-3: { condition: service_healthy }
      postgres: { condition: service_healthy }
    command: uvicorn gateway.app:app --host 0.0.0.0 --port 8000

  loadbalancer:
    build: .
    ports:
      - "8080:8080"
    environment:
      BACKEND_URLS: "http://gateway-1:8000,http://gateway-2:8000,http://gateway-3:8000"
    depends_on:
      - gateway-1
      - gateway-2
      - gateway-3
    command: uvicorn loadbalancer.lb:app --host 0.0.0.0 --port 8080

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - loadbalancer

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
